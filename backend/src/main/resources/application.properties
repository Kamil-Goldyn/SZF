# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/szf?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - WA?NE: Zmie? na bezpieczny klucz w produkcji!
jwt.secret=myVerySecureSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm12345
jwt.expiration=86400000

# Application Configuration
server.port=8080
spring.application.name=Company Management System

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Spring Security - Dla testów mo?esz wy??czy? security
# spring.security.user.name=admin
# spring.security.user.password=admin123
# spring.security.user.roles=USER

# Logging
logging.level.com.company.management=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG